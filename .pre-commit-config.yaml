# uv run pre-commit install --hook-type pre-commit --hook-type pre-push
#
# ruff, mypy and pytest run from the locked dev environment, so they're the
# same versions CI uses. External hook repos are pinned to commit SHAs.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: uvx zizmor==1.31.1 --offline
        language: system
        files: ^\.github/
        types: [yaml]
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest -q --cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
